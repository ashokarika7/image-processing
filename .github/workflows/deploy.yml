
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ashok40/image-processing-api
      AWS_REGION: eu-north-1
      EC2_INSTANCE_ID: i-098446f85f660894d

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

 
      - name: Deploy through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          COMMANDS=$(cat <<EOF
          set -e
          sudo kubectl set image deployment/image-processing-api api=${IMAGE}
          sudo kubectl set image deployment/image-processing-worker worker=${IMAGE}
          sudo kubectl rollout status deployment/image-processing-api --timeout=180s
          sudo kubectl rollout status deployment/image-processing-worker --timeout=180s

          # Check API health
          for i in \$(seq 1 12); do
            if curl -fsS --max-time 5 http://127.0.0.1:30080/docs > /dev/null; then
              echo "API health check passed"
              exit 0
            fi

            echo "Waiting for API to become healthy... (\$i/12)"
            sleep 5
          done

          echo "API health check failed"
          exit 1
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -cn --arg cmd "$COMMANDS" '{commands:[$cmd]}')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text