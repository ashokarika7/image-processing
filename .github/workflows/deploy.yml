
name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ashok40/image-processing-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG
          script: |
            set -e

            echo "Deploying image: ${IMAGE_NAME}:${IMAGE_TAG}"

            sudo kubectl set image \
              deployment/image-processing-api \
              api=${IMAGE_NAME}:${IMAGE_TAG}

            sudo kubectl set image \
              deployment/image-processing-worker \
              worker=${IMAGE_NAME}:${IMAGE_TAG}

            sudo kubectl rollout status \
              deployment/image-processing-api \
              --timeout=180s

            sudo kubectl rollout status \
              deployment/image-processing-worker \
              --timeout=180s

            echo "Deployment completed successfully"