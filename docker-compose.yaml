
services:
  api:
    build: .
    container_name: image-processing-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    container_name: image-processing-worker
    env_file:
      - .env
    command: ["python", "-m", "services.sqs_worker"]
    restart: unless-stopped